[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfl-lang"
version = "0.1.0"
description = "SFL lexer, serialized AST compiler and interpreter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sfl = "sfl.__main__:main"

[tool.setuptools]
packages = ["sfl"]
include-package-data = false

[tool.setuptools.package-data]
sfl = ["stdlib/*.sfl"]
